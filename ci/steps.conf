cwd = samen_core
modes = quick pr full
inputs = app:samen_core driftwood/ pawchart/ demo/ samen_web/
reads = **
marker = ==> agent coverage verifier: PASSED
est_s = 20
group = samen_core

[step verify_tool_actor_identity]
