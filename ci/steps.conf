# ═══ SERIAL TAIL — everything below runs alone, in this order, after the parallel batch above ═══
# (each is a barrier: it mutates shared files — the abbrev registry, source under test, probe
# files under an app's lib/ or test/ — so nothing may run beside it)
[step multinode]
cmd = epmd -daemon 2>/dev/null || true
    SAMEN_MULTINODE=1 mix test test/multinode/oban_multinode_test.exs
cwd = samen_core
modes = full
serial = 1
inputs = app:samen_core
reads = **
locks = db:samen_core_multinode_test
marker = ==> multi-node Oban proof: PASSED
skip_marker = ==> Skipping multi-node Oban proof (opt-in: SAMEN_MULTINODE=1 ./ci.sh boots the 2-node cluster)
exunit_dir = samen_core
est_s = 40
group = samen_core

# ═══ gen probes — registry-mutating → serial, wrapped by the T107 interrupt-safe guard ════════════
# The driver signals a step's whole process group with SIGTERM first, so run_gen_probe's
# SIGINT/SIGTERM/ERR/EXIT trap still restores samen_core/priv/abbrev_registry.json byte-exact.
[step gen_flagship_probe]
cmd = source scripts/gen_probe_guard.sh
    run_gen_probe "priv/gen_app_flagship_probe.exs" "gen_app flagship probe (WS-D D6 / AC-X-1 — generate → ci.sh → seed → boot → 2 sabotages)"
modes = pr full
serial = 1
inputs = app:samen_web app:samen_core scripts/gen_probe_guard.sh
marker = ==> gen_app flagship probe (WS-D D6 / AC-X-1 — generate → ci.sh → seed → boot → 2 sabotages): PASSED
est_s = 120
group = gen_probes

[step gen_post_probe]
cmd = source scripts/gen_probe_guard.sh
    run_gen_probe "priv/gen_post_probe.exs" "gen_app post-app generator probe (WS-D D7a — gen.scope + gen.resource → ci.sh + 4 G26 files + sabotage)"
modes = pr full
serial = 1
inputs = app:samen_web app:samen_core scripts/gen_probe_guard.sh
marker = ==> gen_app post-app generator probe (WS-D D7a — gen.scope + gen.resource → ci.sh + 4 G26 files + sabotage): PASSED
est_s = 100
group = gen_probes

[step gen_deploy_probe]
cmd = source scripts/gen_probe_guard.sh
    run_gen_probe "priv/gen_app_deploy_probe.exs" "gen_app deploy probe (WS-D D10 / AC-G16-1/2/3 — --deploy → ci.sh + fail-closed runtime + sabotage)"
modes = pr full
serial = 1
inputs = app:samen_web app:samen_core scripts/gen_probe_guard.sh
marker = ==> gen_app deploy probe (WS-D D10 / AC-G16-1/2/3 — --deploy → ci.sh + fail-closed runtime + sabotage): PASSED
est_s = 100
group = gen_probes

[step gen_agent_probe]
cmd = source scripts/gen_probe_guard.sh
    run_gen_probe "priv/gen_agent_probe.exs" "gen_agent probe (ADR-047 A7 — samen.gen.agent scaffold → emitted AgentCase proof + sabotage)"
modes = pr full
serial = 1
inputs = app:samen_web app:samen_core scripts/gen_probe_guard.sh
marker = ==> gen_agent probe (ADR-047 A7 — samen.gen.agent scaffold → emitted AgentCase proof + sabotage): PASSED
est_s = 60
group = gen_probes

# ═══ sabotage harness (selection regressions unconditional; replay diff-aware or opt-in corpus) ══
# serial: writes probe patches into scripts/sabotages/ and a probe module under samen_core/lib/.
[step sabotage_selection_test]
cmd = bash scripts/sabotage_selection_test.sh
modes = quick pr full
serial = 1
inputs = scripts/sabotage.sh scripts/sabotage_lint.sh scripts/sabotage_selection_test.sh
marker = ==> sabotage selection regression: PASSED
est_s = 5
group = sabotage

# The replay of every sabotage whose touched files intersect the diff vs the merge-base (tracked
# + untracked). Split into ~300 s sub-steps by patch-number range so the budget can stop between
# them; each sub-step's PROCESSED count must equal its chunk size.
[step sabotage_changed]
cmd = bash scripts/sabotage.sh --changed "$CI_MERGE_BASE" $CI_SHARD_ARGS
modes = quick pr
serial = 1
inputs = ** @base
shard_list = bash scripts/sabotage.sh --changed "$CI_MERGE_BASE" --list | sed -n 's/^  \([0-9][0-9]*-[^ ]*\.patch\).*/\1/p'
shard_kind = ranges
shard_each_s = 25
shard_target_s = 300
shard_check = ^SABOTAGE HARNESS: PROCESSED ([0-9]+) of [0-9]+ SELECTED
superseded_by = sabotage_corpus
est_s = 60
group = sabotage

# The full corpus (opt-in SAMEN_SABOTAGE=1 / full mode). Unbudgeted (./ci.sh) it is EXACTLY the
# pre-ADR-053 command: two lanes on a clean tree, the serial harness otherwise.
[step sabotage_corpus]
cmd = bash scripts/sabotage.sh $CI_SHARD_ARGS
unsharded_cmd = if [[ -z "$(git -C "$REPO_ROOT" status --porcelain)" ]]; then
      bash scripts/sabotage-lanes.sh
    else
      echo "    (working tree has uncommitted edits — running the SERIAL harness; lanes need a commit)"
      bash scripts/sabotage.sh
    fi
modes = full
serial = 1
inputs = **
shard_list = ls scripts/sabotages/ | grep '\.patch$' | sort -V
shard_kind = ranges
shard_each_s = 25
shard_target_s = 300
shard_check = ^SABOTAGE HARNESS: PROCESSED ([0-9]+) of [0-9]+ SELECTED
marker = ==> sabotage harness: PASSED
skip_marker = ==> Skipping sabotage harness (opt-in: SAMEN_SABOTAGE=1 ./ci.sh replays all gate sabotages)
est_s = 9000
group = sabotage

# ═══ mutation gate (ADR-049) ════════════════════════════════════════════════════════════════════
# serial: writes probe modules/tests under samen_core/lib + samen_core/test.
[step mutation_selection_test]
cmd = bash scripts/mutation_selection_test.sh
modes = quick pr full
serial = 1
inputs = scripts/mutation/ scripts/mutation_lint.sh scripts/mutate.sh scripts/mutation_selection_test.sh
marker = ==> mutation-gate self-test: PASSED
est_s = 15
group = mutation

[step mutation_changed]
cmd = bash scripts/mutate.sh --changed "$CI_MERGE_BASE" $CI_SHARD_ARGS
modes = pr
serial = 1
inputs = ** @base
shard_list = bash scripts/mutate.sh --changed "$CI_MERGE_BASE" --list | sed -n 's/^MUTATION SELECTION: \([0-9]*\) of .*/\1/p'
shard_kind = modulo
shard_each_s = 6
shard_target_s = 300
shard_check = ^  mutants run +: ([0-9]+)
superseded_by = mutation_watchlist
est_s = 30
group = mutation

[step mutation_watchlist]
cmd = bash scripts/mutate.sh $CI_SHARD_ARGS
unsharded_cmd = bash scripts/mutate.sh
modes = full
serial = 1
inputs = **
shard_list = bash scripts/mutate.sh --list | sed -n 's/^MUTATION SELECTION: \([0-9]*\) of .*/\1/p'
shard_kind = modulo
shard_each_s = 6
shard_target_s = 300
shard_check = ^  mutants run +: ([0-9]+)
marker = ==> mutation gate: PASSED
skip_marker = ==> Skipping mutation gate (opt-in: SAMEN_MUTATION=1 ./ci.sh replays the tier-1 watch-list)
est_s = 1000
group = mutation
