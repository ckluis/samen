# ═══ samen_core (kernel) ════════════════════════════════════════════════════════════════════════
# reads = ** — the suite is NOT self-contained: doc_commands/doc_recipes read docs/, the anti-bypass
# probes and tree-wide verifiers scan every app (driftwood's agent, the leverage guard), and
# meta/ tests glob */test/**. Until those reads are mapped file by file, ANY change re-keys it.
[step samen_core]
cmd = mix deps.get --quiet && mix test --warnings-as-errors
cwd = samen_core
modes = quick fast pr full
inputs = app:samen_core
reads = **
locks = db:samen_core_test
marker = ==> samen_core: PASSED
exunit_dir = samen_core
est_s = 300
group = samen_core

# quick-only: a docs/ edit re-runs the doc tests (the part of samen_core's suite that reads docs/),
# not the whole kernel suite. pr/full run the whole suite above, which includes these files.
[step doc_tests]
cmd = mix test --warnings-as-errors test/doc_commands_test.exs test/doc_recipes_test.exs
cwd = samen_core
modes = quick
inputs = docs/ *.md */*.md
reads = **
locks = db:samen_core_test
exunit_dir = samen_core
est_s = 40
group = samen_core

[step ai_eval]
cmd = mix test --warnings-as-errors test/ai_eval/
cwd = samen_core
modes = quick pr full
inputs = app:samen_core
reads = **
locks = db:samen_core_test
marker = ==> AI eval tier: PASSED
exunit_dir = samen_core
est_s = 40
group = samen_core

[step verify_agent_coverage]
