inputs = scripts/sabotage-lanes.sh scripts/sabotage_lanes_test.sh
marker = ==> sabotage-lanes regression: PASSED
est_s = 5
group = sabotage

# mutation-gate preflight (ADR-049): watch-list + ledger resolve; elixir script, no mix project
[step mutation_lint]
cmd = bash scripts/mutation_lint.sh
modes = quick pr full
inputs = scripts/mutation/ scripts/mutation_lint.sh scripts/mutate.sh */lib/ */test/
reads = **
