# ci/steps.conf — THE step manifest (ADR-053 §2.1). The single source of what CI runs.
#
# Read by scripts/ci (the driver; `scripts/ci list`, `scripts/ci explain <step>`). ./ci.sh and
# ./ci-fast.sh are thin wrappers over it, so a step added here is a step every entry point runs.
#
# WHY NOT A TSV. A step carries a multi-line shell command, several path globs and marker lines;
# as TSV every row would be a 300-character line nobody can review in a diff. This is the
# stdlib-parseable INI dialect (python3 configparser, interpolation OFF — `%` and `$` are literal),
# one stanza per step, continuation lines indented. Unknown keys are a hard error (a typo'd
# `input =` must never silently become "no inputs").
#
# ── [app NAME] — the dependency graph, explicit (verified against each mix.exs path deps) ──
#   path  the app's directory        deps  the apps it path-depends on (transitively expanded)
#
# ── [group NAME] ── marker = lines printed (wrapper mode) once EVERY planned step of the group passed
#
# ── [step ID] ──
#   cmd        bash, run as `bash -c 'set -euo pipefail; <cmd>'` in `cwd` (default: repo root).
#              Exported: REPO_ROOT, CI_MODE, CI_STEP, CI_BASE (ref), CI_BASE_SHA, CI_MERGE_BASE,
#              CI_SHARD_ARGS (sharded steps).
#   modes      any of: quick fast pr full   (fast = the ./ci-fast.sh subset)
#   inputs     path patterns whose CONTENT decides (a) whether `quick` selects the step and
#              (b) the cache key. `dir/` = prefix · glob (`*` crosses `/`) · exact path ·
#              `**` = the whole tree · `app:NAME` = NAME's dir + every transitive dep's dir
#              MINUS that dep's test/ (deps compile lib only; verified: no dependent reads a
#              framework test file) · `!pattern` excludes · `@base` keys on the base ref too.
#              Tracked AND untracked-not-ignored files count. A step with NO inputs and NO reads
#              is NEVER cached.
#   reads      extra patterns that feed the cache key ONLY (not quick selection): files a suite
#              reads at runtime outside its own app (tree-wide scans, doc tests).
#   always     1 = quick selects it whatever the diff (still cached by content).
#   serial     1 = runs ALONE: waits for everything running, nothing starts beside it, manifest
#              order. Required for anything that mutates shared files (abbrev registry, source
#              patches, probe files under an app's lib/ or test/).
#   locks      resource names; steps sharing one never overlap. Every step with a cwd other than
#              the root implicitly holds dir:<cwd> (one mix process per project at a time — no
#              _build/deps race). db:<name> for each database a step uses.
#   est_s      measured wall-clock (ADR-053 §1.1); the budget scheduler uses it.
#   group      grouping for --only and group markers.
#   marker     lines printed after PASS/CACHED in wrapper mode (--markers): the exact
#              `==> … PASSED` lines the pre-ADR-053 ci.sh / ci-fast.sh printed.
#   marker_if  regex the step's log must match for `marker` to print (else the step passed
#              without earning the marker, e.g. the double sweep's no-origin/main branch).
#   skip_marker  printed in wrapper mode when an opt-in step is NOT in the plan.
#   echo_log   regex: matching log lines are always echoed (loud banners must stay loud).
#   exunit_dir the mix project a failing test's file:line is relative to → enables the
#              one-shot FLAKY rerun (`mix test <file:line>…` there).
#   superseded_by  drop this step when any named step is also planned (corpus ⊇ --changed).
#   shard_list / shard_kind (ranges|modulo) / shard_each_s / shard_target_s / shard_check /
#   unsharded_cmd   — a long internal loop split into budget-sized sub-steps (see scripts/ci).
# ═══ dependency graph ═══════════════════════════════════════════════════════════════════════════
[app samen_core]
path = samen_core/
deps =

[app samen_web]
path = samen_web/
deps = samen_core

[app demo]
path = demo/
deps = samen_core

[app driftwood]
path = driftwood/
deps = samen_core samen_web

[app pawchart]
path = pawchart/
deps = samen_core samen_web

[app samen_stripe]
path = samen_stripe/
deps = samen_core

[app samen_postmark]
path = samen_postmark/
deps = samen_core

[app samen_ses]
path = samen_ses/
deps = samen_core

[app samen_resend]
path = samen_resend/
deps = samen_core

[app samen_anthropic]
path = samen_anthropic/
deps = samen_core

# ═══ groups ═════════════════════════════════════════════════════════════════════════════════════
[group spikes]
marker = ==> All spikes passed.

[group dialyzer]
marker = ==> dialyzer: PASSED

# ═══ preflight (cheap, no DB) ═══════════════════════════════════════════════════════════════════
[step toolchain]
cmd = bash scripts/toolchain_check_test.sh >/dev/null || { echo "toolchain-check SELF-TEST FAILED — rerun scripts/toolchain_check_test.sh for detail"; exit 1; }
    bash scripts/toolchain_check.sh
modes = quick fast pr full
always = 1
serial = 1
inputs = .tool-versions scripts/toolchain_check.sh scripts/toolchain_check_test.sh
echo_log = ^TOOLCHAIN CHECK: (OK|note|FAILED|.*OLDER).*
est_s = 3
group = preflight

[step double_sweep]
cmd = if git -C "$REPO_ROOT" rev-parse --verify -q "$CI_BASE" >/dev/null; then
      bash scripts/double-sweep.sh --base "$CI_BASE"
      echo "==> double sweep: PASSED"
    else
      echo "########################################################################"
      echo "##  DOUBLE SWEEP NOT RUN — $CI_BASE is not present in this clone"
      echo "##  The G-06 anchor/disarm check needs a previous HEAD. This run proves NOTHING"
      echo "##  about whether your edits disarmed a shipped sabotage."
      echo "##  Fix: git fetch origin main   (or run scripts/double-sweep.sh --base <ref>)"
      echo "########################################################################"
    fi
modes = quick pr full
inputs = ** @base
marker = ==> double sweep: PASSED
marker_if = ^==> double sweep: PASSED$
echo_log = ^##.*
est_s = 10
group = preflight

[step double_sweep_test]
cmd = bash scripts/double_sweep_test.sh
modes = quick pr full
inputs = scripts/double-sweep.sh scripts/double_sweep_test.sh
marker = ==> double-sweep regression: PASSED
est_s = 3
group = preflight

[step apply_check]
cmd = bash scripts/sabotage_apply_check_test.sh >/dev/null || { echo "sabotage apply-check SELF-TEST FAILED — rerun scripts/sabotage_apply_check_test.sh for detail"; exit 1; }
    bash scripts/sabotage_apply_check.sh
modes = quick fast pr full
always = 1
inputs = **
marker = ==> sabotage apply-check: PASSED
est_s = 6
group = preflight

[step ci_selftest]
cmd = bash scripts/ci_test.sh
modes = quick pr full
inputs = scripts/ci scripts/ci_driver.py scripts/ci_test.sh scripts/ci_test_legacy.py ci/ ci.sh ci-fast.sh scripts/dialyzer_gate.sh
est_s = 40
group = preflight

[step sabotage_lanes_test]
