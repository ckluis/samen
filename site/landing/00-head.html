<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Samen — the B2B SaaS foundry where every guarantee can fail</title>
<meta name="description" content="Samen is an Elixir · Ash · Phoenix foundry for launching many B2B SaaS products from one substrate: PII masked by default, second-party reveal, crypto-shred erasure, an AI agent that can only propose, and {{SABOTAGES}} committed sabotages proving every test can fail.">
<meta property="og:title" content="Samen — the hard 80% of a B2B SaaS, solved once and proven on every commit">
<meta property="og:description" content="One command emits a running product. PII is masked by default. Every guarantee ships with a sabotage that proves its test can fail.">
<meta name="theme-color" content="#0A0B11">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230A0B11'/%3E%3Ctext x='32' y='45' font-family='Georgia,serif' font-size='38' font-weight='700' fill='%23F3F2EF' text-anchor='middle'%3Es%3C/text%3E%3Ccircle cx='49' cy='42' r='4.5' fill='%238C98F8'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..700;1,9..144,400..700&family=Inter:wght@400;450;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ---------- tokens: samen's palette, re-lit for a night ground ---------- */
:root{
  --bg:#0A0B11;--bg-2:#0E1018;--card:#12141F;--raised:#181B28;--raised-2:#1F2333;
  --hair:#1E2130;--hair-2:#2A2E42;
  --ink:#F3F2EF;--body:#C3C5D3;--muted:#8D90A6;--faint:#5D6078;
  --indigo:#8C98F8;--indigo-deep:#3B4CCA;--amber:#E3A54F;--green:#4CC294;--rose:#EC8582;--sky:#6CC3E8;--violet:#B79CF5;
  --accent:var(--indigo);
  --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  --display:'Fraunces',Georgia,'Times New Roman',serif;
  --sans:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --gut:clamp(16px,5vw,44px);
  --ease:cubic-bezier(.2,.7,.1,1);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--body);font:16.5px/1.6 var(--sans);-webkit-font-smoothing:antialiased;overflow-x:hidden}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline;text-underline-offset:3px}
b,strong{color:var(--ink);font-weight:600}
code,.m{font-family:var(--mono);font-size:.88em;color:var(--ink);background:rgba(140,152,248,.08);border:1px solid rgba(140,152,248,.16);border-radius:6px;padding:.08em .38em;white-space:nowrap}
::selection{background:rgba(140,152,248,.35);color:#fff}
.wrap{max-width:1260px;margin:0 auto;padding:0 var(--gut)}
.skip{position:absolute;left:-999px}.skip:focus{left:16px;top:16px;z-index:200;background:var(--ink);color:var(--bg);padding:8px 12px;border-radius:8px}

/* ---------- top nav ---------- */
nav.top{position:sticky;top:0;z-index:60;background:rgba(10,11,17,.78);backdrop-filter:saturate(1.4) blur(14px);-webkit-backdrop-filter:saturate(1.4) blur(14px);border-bottom:1px solid var(--hair)}
nav.top .in{display:flex;align-items:center;gap:20px;height:60px}
.logo{font:600 22px/1 var(--display);color:var(--ink);letter-spacing:-.01em;flex:none}
.logo i{font-style:normal;color:var(--indigo)}
.logo:hover{text-decoration:none}
nav.top ol{display:flex;gap:2px;list-style:none;margin:0 0 0 auto;padding:0;overflow-x:auto;scrollbar-width:none}
nav.top ol::-webkit-scrollbar{display:none}
nav.top li a{display:block;white-space:nowrap;font:500 13px/1 var(--sans);color:var(--muted);padding:9px 10px;border-radius:8px}
nav.top li a span{font:500 10.5px/1 var(--mono);color:var(--faint);margin-right:5px}
nav.top li a:hover,nav.top li a.on{color:var(--ink);background:rgba(255,255,255,.04);text-decoration:none}
nav.top li a.on span{color:var(--indigo)}
.gh{flex:none;font:600 13px/1 var(--sans);color:var(--ink);border:1px solid var(--hair-2);border-radius:999px;padding:10px 14px}
.gh:hover{border-color:var(--muted);text-decoration:none}
.prog{position:absolute;left:0;bottom:-1px;height:1px;width:0;background:linear-gradient(90deg,var(--indigo),var(--sky))}
@media (max-width:1100px){nav.top ol li.x{display:none}}
@media (max-width:760px){nav.top ol{display:none}.gh{margin-left:auto}}

/* ---------- type ---------- */
.eyebrow{display:flex;align-items:center;gap:10px;font:600 12px/1 var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--accent)}
.eyebrow .n{color:var(--faint)}
.eyebrow .act{color:var(--faint);letter-spacing:.12em;margin-left:4px}
h1,h2,h3{font-family:var(--display);color:var(--ink);font-weight:600;letter-spacing:-.022em;margin:0;font-variation-settings:"opsz" 144}
h3{letter-spacing:-.008em;font-variation-settings:"opsz" 48}
h1 em,h2 em,h3 em{font-style:italic;font-weight:500;color:var(--accent)}
h1{font-size:clamp(46px,7.2vw,104px);line-height:.98}
h2{font-size:clamp(38px,5.2vw,76px);line-height:1}
.punch{font-size:clamp(17px,1.45vw,20px);line-height:1.6;color:var(--body);margin:24px 0 0;max-width:40em}
.punch b{color:var(--ink)}

/* ---------- hero ---------- */
header.hero{position:relative;overflow:hidden;padding:clamp(70px,10vw,130px) 0 clamp(56px,7vw,90px);border-bottom:1px solid var(--hair)}
.hero .grid{display:grid;grid-template-columns:1.08fr .92fr;gap:clamp(28px,4vw,60px);align-items:center}
.hero .sub{font-size:clamp(17.5px,1.5vw,21px);line-height:1.6;color:var(--body);margin:28px 0 0;max-width:36em}
.hero .tech{font:600 11.5px/1 var(--mono);letter-spacing:.18em;text-transform:uppercase;color:var(--indigo);margin-bottom:26px;display:flex;flex-wrap:wrap;gap:8px 14px}
.hero .tech span{color:var(--faint)}
.cta{display:flex;flex-wrap:wrap;gap:12px;margin-top:34px}
.btn{display:inline-flex;align-items:center;gap:8px;font:600 14.5px/1 var(--sans);color:var(--ink);border:1px solid var(--hair-2);border-radius:999px;padding:14px 20px;background:rgba(255,255,255,.02);transition:border-color .2s,background .2s,transform .2s}
.btn:hover{text-decoration:none;border-color:var(--muted);background:rgba(255,255,255,.05)}
.btn.a{color:var(--bg);background:var(--accent);border-color:var(--accent)}
.btn.a:hover{background:#fff;border-color:#fff}
.btn.o{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 55%,transparent)}
.btn.o:hover{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,transparent)}
.btn .ar{transition:transform .2s}.btn:hover .ar{transform:translateX(3px)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);margin-top:clamp(48px,6vw,80px);border:1px solid var(--hair-2);border-radius:20px;background:linear-gradient(180deg,rgba(255,255,255,.025),rgba(255,255,255,0));overflow:hidden}
.stat{padding:24px 26px 22px;border-left:1px solid var(--hair-2)}
.stat:first-child{border-left:0}
.stat .v{font:600 clamp(40px,4.2vw,60px)/1 var(--display);color:var(--ink);letter-spacing:-.02em}
.stat .v em{font-style:normal;color:var(--indigo)}
.stat .k{margin-top:10px;font-size:14.5px;line-height:1.45;color:var(--body)}
.stat .s{margin-top:12px;font:11px/1.4 var(--mono);color:var(--faint)}
@media (max-width:980px){.hero .grid{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr}.stat:nth-child(3){border-left:0}.stat:nth-child(n+3){border-top:1px solid var(--hair-2)}}
@media (max-width:520px){.stats{grid-template-columns:1fr}.stat{border-left:0!important;border-top:1px solid var(--hair-2)}.stat:first-child{border-top:0}}

/* glows */
.glow{position:absolute;width:900px;height:900px;border-radius:50%;pointer-events:none;background:radial-gradient(closest-side,color-mix(in srgb,var(--accent) 22%,transparent),transparent 70%);opacity:.55;filter:blur(10px);animation:drift 22s ease-in-out infinite alternate}
@keyframes drift{0%{transform:translate(0,0) scale(1)}100%{transform:translate(-60px,40px) scale(1.08)}}

/* ---------- the map (act index) ---------- */
section.map{padding:clamp(70px,9vw,120px) 0;border-bottom:1px solid var(--hair);position:relative;overflow:hidden}
.map h2{max-width:16ch}
.acts{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-top:48px}
.actc{border:1px solid var(--hair-2);border-radius:18px;padding:22px 22px 18px;background:var(--card);position:relative;overflow:hidden}
.actc::before{content:"";position:absolute;inset:0 0 auto;height:2px;background:var(--ac,var(--indigo))}
.actc .an{font:600 11px/1.45 var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--ac,var(--indigo))}
.actc h3{font-size:24px;line-height:1.15;margin:12px 0 10px}
.actc p{font-size:14.5px;margin:0 0 14px;color:var(--body)}
.actc ul{list-style:none;margin:0;padding:0;border-top:1px solid var(--hair)}
.actc li a{display:flex;gap:10px;align-items:baseline;padding:9px 0;border-bottom:1px solid var(--hair);color:var(--ink);font-size:14.5px}
.actc li a span{font:500 11px/1 var(--mono);color:var(--faint);flex:none;width:20px}
.actc li a:hover{text-decoration:none;color:var(--ac,var(--indigo))}
.actc li:last-child a{border-bottom:0}
@media (max-width:1040px){.acts{grid-template-columns:1fr 1fr}}
@media (max-width:600px){.acts{grid-template-columns:1fr}}

/* ---------- act dividers ---------- */
.actbar{border-bottom:1px solid var(--hair);background:linear-gradient(180deg,var(--bg-2),var(--bg));padding:clamp(56px,7vw,96px) 0 clamp(40px,5vw,64px)}
.actbar .an{font:600 12px/1 var(--mono);letter-spacing:.2em;text-transform:uppercase;color:var(--ac)}
.actbar h2{font-size:clamp(32px,4vw,56px);margin-top:16px;max-width:22ch}
.actbar p{max-width:44em;margin:18px 0 0;font-size:17.5px}

/* ---------- feature bands ---------- */
section.band{position:relative;overflow:hidden;border-bottom:1px solid var(--hair);padding:clamp(80px,11vw,150px) 0}
section.band:nth-of-type(even){background:linear-gradient(180deg,rgba(255,255,255,.012),rgba(255,255,255,0))}
.vh{display:grid;grid-template-columns:1fr 1.06fr;gap:clamp(32px,5vw,80px);align-items:center;position:relative}
.band.flip .copy{order:2}
.copy h2{margin-top:22px;max-width:13ch}
.copy h2.w{max-width:16ch}
.big{display:flex;align-items:flex-end;gap:18px;margin:34px 0 0;flex-wrap:wrap}
.big .n{font:600 clamp(80px,10vw,138px)/.8 var(--display);color:var(--accent);letter-spacing:-.04em;text-shadow:0 0 70px color-mix(in srgb,var(--accent) 45%,transparent);font-variant-numeric:tabular-nums}
.big .l{font-size:15.5px;line-height:1.5;color:var(--body);max-width:22em;padding-bottom:6px}
.big .l b{color:var(--ink)}
.tag{display:inline-block;vertical-align:middle;font:600 10px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;padding:5px 7px;border-radius:5px;margin-left:4px;white-space:nowrap}
.tag.meas{color:var(--green);background:rgba(76,194,148,.1);border:1px solid rgba(76,194,148,.32)}
.tag.built{color:var(--indigo);background:rgba(140,152,248,.1);border:1px solid rgba(140,152,248,.32)}
.tag.live{color:var(--sky);background:rgba(108,195,232,.1);border:1px solid rgba(108,195,232,.32)}
.tag.scope{color:var(--amber);background:rgba(227,165,79,.1);border:1px solid rgba(227,165,79,.32)}
ul.ticks{list-style:none;margin:30px 0 0;padding:0;display:grid;gap:12px}
ul.ticks li{position:relative;padding-left:32px;font-size:16px;line-height:1.5}
ul.ticks li::before{content:"";position:absolute;left:0;top:3px;width:18px;height:18px;border-radius:6px;border:1.5px solid var(--accent);background:color-mix(in srgb,var(--accent) 10%,transparent)}
ul.ticks li::after{content:"";position:absolute;left:6px;top:7px;width:6px;height:9px;border:solid var(--accent);border-width:0 2px 2px 0;transform:rotate(45deg)}
.more{display:flex;flex-wrap:wrap;gap:12px;margin-top:34px}

/* the stage: a framed product object */
.stage{position:relative;border-radius:20px;background:linear-gradient(180deg,var(--raised),var(--card));border:1px solid var(--hair-2);box-shadow:0 40px 120px -30px rgba(0,0,0,.75),0 0 0 1px rgba(255,255,255,.015) inset,0 0 140px -60px color-mix(in srgb,var(--accent) 60%,transparent);padding:18px;min-width:0}
.stage::before{content:attr(data-label);display:block;font:600 10.5px/1.5 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--faint);padding:4px 4px 14px;border-bottom:1px solid var(--hair);margin-bottom:14px}
.stage svg{display:block;width:100%;height:auto}
.stage .cap{font:12px/1.55 var(--mono);color:var(--muted);margin:12px 4px 2px}
@media (max-width:960px){.vh{grid-template-columns:1fr}.band.flip .copy{order:0}.copy h2,.copy h2.w{max-width:none}}

/* svg text classes */
.t-mono{font-family:var(--mono)}.t-disp{font-family:var(--display)}
.t-ink{fill:var(--ink)}.t-body{fill:var(--body)}.t-mute{fill:var(--muted)}.t-faint{fill:var(--faint)}
.t-acc{fill:var(--accent)}.t-green{fill:var(--green)}.t-rose{fill:var(--rose)}.t-amber{fill:var(--amber)}.t-indigo{fill:var(--indigo)}.t-sky{fill:var(--sky)}.t-violet{fill:var(--violet)}
.f-card{fill:var(--card)}.f-raised{fill:var(--raised)}.f-raised2{fill:var(--raised-2)}.s-hair{stroke:var(--hair-2)}

/* html "screens" inside stages */
.scr{font:13px/1.5 var(--sans);color:var(--body)}
.term{font:12.5px/1.75 var(--mono);color:var(--body);background:#07080D;border:1px solid var(--hair);border-radius:12px;padding:14px 16px;overflow-x:auto;white-space:pre}
.term .p{color:var(--faint)}.term .c{color:var(--ink)}.term .ok{color:var(--green)}.term .no{color:var(--rose)}.term .ac{color:var(--accent)}.term .am{color:var(--amber)}.term .mu{color:var(--muted)}
.term .ln{display:block;min-height:1.75em}
.mask{letter-spacing:.06em;color:var(--muted)}

/* ---------- side panels (no-JS :target; JS enhances) ---------- */
.panel{position:fixed;inset:0 0 0 auto;z-index:90;width:min(620px,100vw);background:#0C0D14;border-left:1px solid var(--hair-2);box-shadow:-40px 0 120px rgba(0,0,0,.65);transform:translateX(104%);transition:transform .45s var(--ease),visibility 0s linear .45s;visibility:hidden;overflow-y:auto;overscroll-behavior:contain}
.panel:target,.panel.open{transform:none;visibility:visible;transition:transform .45s var(--ease),visibility 0s}
.scrim{position:fixed;inset:0;z-index:89;background:rgba(3,3,7,.62);backdrop-filter:blur(3px);opacity:0;pointer-events:none;transition:opacity .35s}
.panel:target + .scrim,.panel.open + .scrim{opacity:1;pointer-events:auto}
.panel .ph{position:sticky;top:0;z-index:2;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 26px;background:rgba(12,13,20,.93);backdrop-filter:blur(10px);border-bottom:1px solid var(--hair)}
.panel .ph .eyebrow{font-size:11px}
.panel .x{font:600 12.5px/1 var(--mono);color:var(--muted);border:1px solid var(--hair-2);border-radius:999px;padding:8px 12px}
.panel .x:hover{color:var(--ink);text-decoration:none;border-color:var(--muted)}
.panel .pb{padding:28px 26px 64px}
.panel h3{font-size:32px;line-height:1.08;margin:0 0 16px}
.panel h4{font:600 11.5px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--accent);margin:32px 0 12px}
.panel p{margin:0 0 12px;font-size:15.5px}
.panel ul,.panel ol{margin:0 0 12px;padding-left:20px;font-size:15px}
.panel li{margin:6px 0}
.panel table{width:100%;border-collapse:collapse;font-size:14px;margin:4px 0 12px}
.panel th,.panel td{text-align:left;vertical-align:top;padding:9px 8px;border-bottom:1px solid var(--hair)}
.panel th{font:600 10.5px/1.2 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.panel td:first-child{color:var(--ink);white-space:nowrap}
.panel .src{font:12px/1.65 var(--mono);color:var(--muted);background:var(--card);border:1px solid var(--hair);border-radius:12px;padding:12px 14px;word-break:break-word;margin-top:28px}
.panel .src a{color:var(--muted);text-decoration:underline;text-decoration-color:var(--hair-2)}
.panel pre{font:12.5px/1.65 var(--mono);color:var(--body);background:#07080D;border:1px solid var(--hair);border-radius:12px;padding:12px 14px;overflow-x:auto;margin:0 0 12px}
.panel .not{border:1px solid rgba(227,165,79,.3);background:rgba(227,165,79,.06);border-radius:12px;padding:14px 16px;font-size:14.5px;margin:12px 0}
.panel .not b{color:var(--amber)}
.panel .status{display:grid;grid-template-columns:auto 1fr;gap:8px 12px;font-size:14.5px;align-items:baseline}
.panel:focus{outline:none}

/* ---------- plain sections ---------- */
section.plain{padding:clamp(80px,10vw,140px) 0;border-bottom:1px solid var(--hair);position:relative;overflow:hidden}
.nots{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:44px}
.notc{border:1px solid var(--hair-2);border-radius:18px;padding:22px;background:var(--card)}
.notc .k{font:600 11px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--amber)}
.notc h3{font-size:22px;line-height:1.2;margin:12px 0 10px}
.notc p{font-size:14.5px;margin:0}
@media (max-width:1000px){.nots{grid-template-columns:1fr 1fr}}
@media (max-width:620px){.nots{grid-template-columns:1fr}}
.paths{display:grid;grid-template-columns:1.1fr .9fr;gap:20px;margin-top:44px}
.pathc{min-width:0;border:1px solid var(--hair-2);border-radius:20px;padding:28px;background:var(--card)}
.pathc h3{font-size:30px;line-height:1.1;margin:10px 0 12px}
.links{display:grid;gap:0;margin-top:14px;border-top:1px solid var(--hair)}
.links a{display:flex;justify-content:space-between;gap:16px;padding:14px 0;border-bottom:1px solid var(--hair);color:var(--ink)}
.links a span{color:var(--muted);font-size:14px;text-align:right}
.links a:hover{text-decoration:none;color:var(--indigo)}
@media (max-width:900px){.paths{grid-template-columns:1fr}}
footer{padding:56px 0 70px;color:var(--muted);font-size:14px}
footer .fi{display:flex;flex-wrap:wrap;justify-content:space-between;gap:24px}
footer .credit{max-width:44em}

/* ---------- motion ---------- */
.rv{opacity:1;transform:none}
.js .rv{opacity:0;transform:translateY(22px);transition:opacity .9s var(--ease),transform .9s var(--ease)}
.js .rv.in{opacity:1;transform:none}
.still .rv,.still .panel,.still .scrim{transition:none!important}
.pulse{animation:pulse 2.2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.flow{stroke-dasharray:4 7;animation:flow 1.4s linear infinite}
@keyframes flow{to{stroke-dashoffset:-22}}
.blink{animation:blink 1.1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  .glow,.pulse,.flow,.blink{animation:none}
  .js .rv{opacity:1;transform:none;transition:none}
  .panel,.scrim{transition:none}
}

/* html flow diagrams inside a stage (they reflow; svg text would shrink to nothing on a phone) */
.fd{display:flex;flex-direction:column;font-size:14px;line-height:1.5}
.fd-s{border:1px solid var(--hair-2);border-radius:14px;background:var(--raised);padding:14px 16px;min-width:0}
.fd-s.hot{border-color:var(--amber);background:#1A1410}
.fd-s p{margin:8px 0 0;color:var(--body)}
.fd-s code{font-size:.84em}
.fd-k{display:flex;justify-content:space-between;flex-wrap:wrap;gap:4px 12px;font:600 10.5px/1.4 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--faint)}
.fd-t{display:grid;grid-template-columns:auto minmax(0,1fr);gap:7px 14px;margin-top:10px;align-items:baseline}
.fd-t code{background:none;border:0;padding:0;font-size:12.5px}
.fd-t>span{font-size:13px;color:var(--muted)}
.fd-a{position:relative;padding:9px 0 9px 26px;margin-left:22px;font:500 11px/1.4 var(--mono);border-left:1.5px dashed currentColor}
.fd-f{font:11px/1.5 var(--mono)!important;color:var(--faint)!important}
.fd-c{font:12px/1.5 var(--mono)!important;color:var(--ink)!important;overflow-wrap:anywhere}
.fd-2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.fd-t2{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 10px;margin-top:9px;font:11.5px/1.4 var(--mono)}
.fd-t2 span{color:var(--muted)}.fd-t2 b{font-weight:500;text-align:right;overflow-wrap:anywhere}
.fd-msg{margin-top:10px;background:var(--raised-2);border-radius:10px;padding:9px 11px;font-size:12.5px;color:var(--body);overflow-wrap:anywhere}
.fd-msg b{display:block;font-size:12.5px;margin-bottom:2px}
.fd-msg small{font:10.5px var(--mono);color:var(--faint);letter-spacing:0}
@media (max-width:520px){.fd-t{grid-template-columns:minmax(0,1fr);gap:0}.fd-t>span{margin-bottom:6px}.fd-2{grid-template-columns:minmax(0,1fr)}.fd-s{padding:12px 13px}}

/* ================= IN THE PRODUCT: the real samen screens, redrawn =================
   Concept above, usage below. Everything here is namespaced (.ip wrapper, .ui screen,
   u- prefixed classes) so it cannot collide with the page. The screens stay LIGHT, as
   samen ships them. Switchers are radio + label (CSS only): they work with JS off and the
   first state is the one rendered. */
.ip{margin-top:clamp(56px,7vw,96px);position:relative;min-width:0}
.ip-h{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px 14px;margin-bottom:18px}
.ip-k{display:inline-flex;align-items:center;gap:10px;font:600 11.5px/1 var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--accent)}
.ip-k::before{content:"";width:26px;height:1px;background:currentColor}
.ip-h code{font-size:12px;white-space:normal;overflow-wrap:anywhere}
.ip-h .ip-n{font:12px/1.5 var(--mono);color:var(--faint)}
.ip-t{font:600 clamp(22px,2.4vw,30px)/1.15 var(--display);color:var(--ink);letter-spacing:-.015em;margin:0 0 18px;max-width:34ch}
.ip-cap{font-size:14px;line-height:1.6;color:var(--muted);margin:16px 2px 0;max-width:60em}
.ip-cap b{color:var(--body)}
.ip-cap code{font-size:.85em;white-space:normal}
/* switcher (radios + labels) */
.sw{min-width:0}
.sw>input{position:absolute;opacity:0;width:1px;height:1px;pointer-events:none}
.sw-tabs{display:flex;flex-wrap:wrap;gap:6px;padding:5px;margin:0 0 14px;width:fit-content;max-width:100%;background:var(--card);border:1px solid var(--hair-2);border-radius:16px}
.sw-tab{cursor:pointer;display:flex;align-items:center;gap:8px;font:500 12.5px/1.25 var(--mono);color:var(--muted);padding:9px 14px;border-radius:11px;transition:background .18s,color .18s}
.sw-tab:hover{color:var(--ink)}
.sw-tab i{width:7px;height:7px;border-radius:50%;background:currentColor;opacity:.6;flex:none}
.sw-tab small{font-size:11px;color:var(--faint)}
.sw>input:focus-visible+input~.sw-tabs,.sw>input:focus-visible~.sw-tabs{outline:2px solid var(--accent);outline-offset:3px}
.sw-p,.sw-c{display:none}
.sw-c{font-size:14.5px;line-height:1.55;color:var(--body);margin:0 2px 14px;max-width:62em;min-height:3.1em}
.sw-c b{color:var(--ink)}
.sw-1:checked~.sw-tabs .t1,.sw-2:checked~.sw-tabs .t2,.sw-3:checked~.sw-tabs .t3,.sw-4:checked~.sw-tabs .t4{background:var(--raised-2);color:var(--ink)}
.sw-1:checked~.sw-tabs .t1 i,.sw-2:checked~.sw-tabs .t2 i,.sw-3:checked~.sw-tabs .t3 i,.sw-4:checked~.sw-tabs .t4 i{opacity:1;box-shadow:0 0 0 3px color-mix(in srgb,currentColor 25%,transparent)}
.sw-1:checked~* .p1,.sw-2:checked~* .p2,.sw-3:checked~* .p3,.sw-4:checked~* .p4,
.sw-1:checked~.p1,.sw-2:checked~.p2,.sw-3:checked~.p3,.sw-4:checked~.p4{display:block}
/* per-viewer variants inside ONE screen (replay): .v carries the viewers it belongs to */
.sw-1:checked~* .v:not(.v1),.sw-2:checked~* .v:not(.v2),.sw-3:checked~* .v:not(.v3),.sw-4:checked~* .v:not(.v4){display:none}
@media (prefers-reduced-motion:reduce){.sw-tab{transition:none}}
.still .sw-tab{transition:none}

/* the screen */
.ui{--u-ink:#191A20;--u-mut:#6A6B77;--u-fnt:#8E8F9B;--u-ln:#EBEBEF;--u-ln2:#E1E1E7;--u-cv:#F2F2F5;--u-pn:#FAFAFC;--u-cd:#FFF;
  --u-br:#3B4CCA;--u-brw:#EEF0FD;--u-brl:#D6DBF8;--u-gr:#1E7A45;--u-grw:#E7F3EB;--u-grl:#CBE7D5;--u-am:#93630F;--u-amw:#FBF1DE;--u-aml:#EFD9AE;
  --u-rd:#B9382F;--u-rdw:#FBECEA;--u-vi:#6D45C4;--u-viw:#F1ECFB;--u-vil:#E1D6F7;
  position:relative;min-width:0;background:var(--u-cv);color:var(--u-ink);font:13.5px/1.45 var(--sans);letter-spacing:-.005em;
  border-radius:16px;padding:8px;box-shadow:0 50px 120px -50px rgba(0,0,0,.9),0 0 0 1px rgba(255,255,255,.07),0 0 120px -60px color-mix(in srgb,var(--accent) 70%,transparent)}
.ui *{box-sizing:border-box}
.ui b,.ui strong{color:inherit;font-weight:600}
.ui code,.ui .mo{font:500 .9em/1.4 var(--mono);color:inherit;background:none;border:0;padding:0;white-space:normal;letter-spacing:0}
.ui-app{display:grid;grid-template-columns:196px minmax(0,1fr);gap:8px}
.ui-side{background:var(--u-pn);border:1px solid var(--u-ln);border-radius:12px;padding:12px 10px;display:flex;flex-direction:column;gap:2px;font-size:12.5px}
.ui-ws{display:flex;align-items:center;gap:9px;padding:2px 4px 10px}
.ui-logo{width:28px;height:28px;border-radius:8px;flex:none;display:grid;place-items:center;color:#fff;font-weight:700;font-size:13px;background:linear-gradient(150deg,#0E7C5A,#17A06E)}
.ui-logo.op{background:linear-gradient(150deg,#3B4CCA,#5B6BE0)}
.ui-ws b{display:block;font-size:12.5px;line-height:1.25}.ui-ws span{display:block;font-size:10.5px;color:var(--u-fnt)}
.ui-grp{font-size:9.5px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--u-fnt);padding:10px 6px 4px}
.ui-nav{display:flex;align-items:center;gap:8px;padding:5px 7px;border-radius:7px;color:var(--u-mut)}
.ui-nav::before{content:"";width:6px;height:6px;border-radius:2px;background:#D5D6DE;flex:none}
.ui-nav.on{background:var(--u-cd);border:1px solid var(--u-ln2);color:var(--u-ink);font-weight:550}
.ui-nav.on::before{background:var(--u-br)}
.ui-nav em{margin-left:auto;font:normal 10.5px/1 var(--mono);color:var(--u-fnt)}
.ui-main{background:var(--u-cd);border:1px solid var(--u-ln);border-radius:12px;overflow:hidden;min-width:0}
.ui-top{display:flex;align-items:center;flex-wrap:wrap;gap:8px 12px;padding:10px 16px;border-bottom:1px solid var(--u-ln);background:var(--u-pn)}
.ui-crumb{font-size:11.5px;color:var(--u-fnt);min-width:0;overflow-wrap:anywhere}
.ui-crumb i{font-style:normal;opacity:.5;margin:0 5px}
.ui-who{margin-left:auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ui-who>span{font-size:11px;color:var(--u-mut);line-height:1.25}
.ui-av{width:24px;height:24px;border-radius:50%;flex:none;display:inline-grid;place-items:center;font:600 9.5px/1 var(--sans);background:#DDE7F5;color:#3B4CCA}
.ui-av.q{background:repeating-linear-gradient(115deg,#D6D8E5 0 4px,#E3E4ED 4px 8px);color:transparent}
.ui-chip{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:600;padding:4px 10px;border-radius:999px;white-space:nowrap;border:1px solid}
.ui-chip::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.ui-chip.t{color:var(--u-gr);background:var(--u-grw);border-color:var(--u-grl)}
.ui-chip.o{color:var(--u-br);background:var(--u-brw);border-color:var(--u-brl)}
.ui-chip.a{color:var(--u-vi);background:var(--u-viw);border-color:var(--u-vil)}
.ui-chip.w{color:var(--u-am);background:var(--u-amw);border-color:var(--u-aml)}
.ui-head{display:flex;align-items:center;flex-wrap:wrap;gap:10px;padding:16px 16px 0}
.ui-h{font:650 21px/1.15 var(--sans);letter-spacing:-.025em}
.ui-acts{margin-left:auto;display:flex;flex-wrap:wrap;gap:6px}
.ui-btn{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:550;padding:6px 11px;border-radius:8px;border:1px solid var(--u-ln2);background:var(--u-cd);color:var(--u-ink);white-space:nowrap}
.ui-btn.p{background:#1B1C22;border-color:#1B1C22;color:#fff}
.ui-btn.off{color:var(--u-fnt);border-style:dashed}
.ui-btn.rv{color:var(--u-br);background:var(--u-brw);border-color:var(--u-brl);font-size:11px;padding:4px 8px}
.ui-bar{margin:14px 16px 0;display:flex;align-items:flex-start;gap:12px;padding:10px 14px;border-radius:10px;border:1px solid;font-size:12.5px;line-height:1.45}
.ui-bar>span:first-child{flex:1;min-width:0}
.ui-bar .ui-tag{flex:none;font:500 10.5px/1.3 var(--mono);background:#fff;border:1px solid;border-radius:7px;padding:4px 8px;white-space:nowrap}
.ui-bar.o{background:var(--u-brw);border-color:var(--u-brl);color:#37407A}.ui-bar.o .ui-tag{border-color:var(--u-brl)}
.ui-bar.t{background:var(--u-grw);border-color:var(--u-grl);color:#215938}.ui-bar.t .ui-tag{border-color:var(--u-grl)}
.ui-bar.a{background:var(--u-viw);border-color:var(--u-vil);color:#4B3B78}.ui-bar.a .ui-tag{border-color:var(--u-vil)}
.ui-bar.w{background:#FFF8E1;border-color:#E7CF84;color:#6B5200}
.ui-acct{display:block;margin-top:4px;font:11px/1.45 var(--mono);opacity:.85;overflow-wrap:anywhere}
.ui-wrap{padding:14px 16px 16px}
.ui-gt{display:flex;align-items:center;flex-wrap:wrap;gap:6px 9px;margin:2px 2px 10px}
.ui-gt b{font-size:13.5px}
.ui-n{font-size:11px;font-weight:600;color:var(--u-mut);background:#F0F0F3;border-radius:20px;padding:1px 8px}
.ui-lane{font-size:12px;color:var(--u-fnt)}
.ui-card{border:1px solid var(--u-ln2);border-radius:11px;overflow:hidden;background:var(--u-cd)}
.ui-t{width:100%;border-collapse:collapse;table-layout:fixed}
.ui-t th{text-align:left;font-size:10.5px;font-weight:550;color:var(--u-fnt);padding:9px 12px;border-bottom:1px solid var(--u-ln);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ui-t td{padding:9px 12px;border-bottom:1px solid var(--u-ln);font-size:12.5px;vertical-align:middle;overflow-wrap:anywhere}
.ui-t td .ui-pill,.ui-t td .ui-btn{white-space:normal;line-height:1.35;overflow-wrap:normal}
.ui-t td.wr .ui-btn{margin:2px 0}
.ui-t tr:last-child td{border-bottom:0}
.ui-t .mo{font-size:11.5px}
.ui-drv{display:flex;align-items:center;gap:9px;min-width:0}
.ui-drv>span{overflow:hidden;text-overflow:ellipsis;font-weight:550;color:#3a3b45}
.ui-dim{color:var(--u-mut)}
.ui-m{white-space:nowrap;font-family:var(--mono);letter-spacing:.14em;color:#8C8D99;background:#F0F0F3;border-radius:5px;padding:1px 6px;font-size:11px;font-weight:500}
.ui-pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:550;padding:2px 8px;border-radius:999px;white-space:nowrap;line-height:1.5}
.ui-pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;flex:none}
.ui-pill.ok{background:var(--u-grw);color:var(--u-gr)}.ui-pill.bad{background:var(--u-rdw);color:var(--u-rd)}
.ui-pill.warn{background:var(--u-amw);color:var(--u-am)}.ui-pill.info{background:var(--u-viw);color:var(--u-vi)}
.ui-pill.mut{background:#F0F0F3;color:var(--u-mut)}.ui-pill.br{background:var(--u-brw);color:var(--u-br)}
.ui-attrs{display:flex;flex-wrap:wrap;align-items:center;gap:5px;margin:12px 2px 0;font:10.5px/1.7 var(--mono);color:var(--u-fnt)}
.ui-attrs>span{background:#F0F0F3;border-radius:5px;padding:1px 6px;overflow-wrap:anywhere}
.ui-attrs .c{background:var(--u-grw);color:var(--u-gr)}.ui-attrs .k{background:var(--u-brw);color:var(--u-br)}.ui-attrs .a{background:var(--u-viw);color:var(--u-vi)}
.ui-attrs .l{background:none;padding:0;text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.ui-mets{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;padding:14px 16px 0}
.ui-met{border:1px solid var(--u-ln2);border-radius:11px;padding:11px 13px;min-width:0}
.ui-met span{display:block;font-size:11px;color:var(--u-fnt)}
.ui-met b{display:block;font-size:20px;font-weight:650;letter-spacing:-.02em;margin-top:4px;font-variant-numeric:tabular-nums}
.ui-met small{display:block;font-size:10.5px;color:var(--u-fnt);margin-top:2px}
.ui-supp{display:flex;align-items:center;gap:8px;padding:10px 12px;font-size:12px;font-style:italic;color:var(--u-fnt);border-top:1px solid var(--u-ln)}
.ui-two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
/* chat: one thread, two planes */
.cht{min-width:0}
.cht-tag{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;font:500 12px/1.4 var(--mono);margin:0 2px 10px}
.cht-tag i{width:8px;height:8px;border-radius:50%;background:currentColor;flex:none}
.cht-tag b{color:var(--ink);font-weight:600}
.cht-tag code{font-size:11.5px;white-space:normal;overflow-wrap:anywhere}
.cht-f{padding:0;overflow:hidden;background:var(--u-cd)}
.cht-h{display:flex;align-items:center;flex-wrap:wrap;gap:8px 10px;padding:12px 14px;border-bottom:1px solid var(--u-ln)}
.cht-h>span:nth-child(2){flex:1;min-width:0}
.cht-h b{display:block;font-size:14px;letter-spacing:-.01em}.cht-h span span{display:block;font-size:11px;color:var(--u-fnt)}
.cht-ic,.cht-oi{width:28px;height:28px;border-radius:8px;flex:none;display:grid;place-items:center;color:#fff;font:700 13px/1 var(--sans);background:linear-gradient(150deg,#0E7C5A,#17A06E)}
.cht-ic.op,.cht-oi{background:linear-gradient(150deg,#3B4CCA,#5B6BE0)}
.cht-oi.d{background:linear-gradient(150deg,#0E7C5A,#17A06E)}
.cht-th{padding:14px;display:flex;flex-direction:column;gap:14px;background:#FAFAFC}
.cht-m{display:flex;gap:9px;align-items:flex-start;max-width:96%;min-width:0}
.cht-m>div{min-width:0;flex:1;display:flex;flex-direction:column;gap:7px}
.cht-m.me{flex-direction:row-reverse;align-self:flex-end}
.cht-mm{font-size:11px;color:var(--u-fnt)}.cht-mm b{color:#454652}.cht-mm .mo{font-size:10.5px}
.cht-m.me .cht-mm{text-align:right}
.cht-b{background:var(--u-cd);border:1px solid var(--u-ln2);border-radius:12px;padding:9px 12px;font-size:13px;line-height:1.5;color:#2f3039;overflow-wrap:anywhere}
.cht-m.me .cht-b{background:#1B1C22;border-color:#1B1C22;color:#EDEEF6}
.cht-ref{font:11px/1.5 var(--mono);color:#B9C2FF;background:#2A2C48;border-radius:4px;padding:1px 5px}
.cht-oc{border:1px solid var(--u-ln2);border-radius:11px;background:var(--u-cd);overflow:hidden}
.cht-och{display:flex;align-items:center;gap:9px;padding:10px 12px;border-bottom:1px solid var(--u-ln)}
.cht-och>span:nth-child(2){flex:1;min-width:0}
.cht-och b{display:block;font-size:13px}.cht-och b.ui-m{display:inline-block;font-size:11px}.cht-och span span{display:block;font:10px/1.4 var(--mono);color:var(--u-fnt)}
.cht-r{display:flex;justify-content:space-between;gap:12px;padding:6px 12px;border-top:1px dashed var(--u-ln);font-size:12px}
.cht-och+.cht-r{border-top:0}
.cht-r span:first-child{color:var(--u-fnt);font-size:11px;flex:none}
.cht-r span:last-child{text-align:right;min-width:0;overflow-wrap:anywhere}
.cht-r .mo{font-size:11px}
.cht-of{padding:7px 12px;border-top:1px solid var(--u-ln);background:#FAFBFD;font-size:10.5px}
.cht-of.t{color:var(--u-gr)}.cht-of.o{color:var(--u-br)}
.cht-p{display:flex;align-items:center;gap:7px;padding:8px 14px;border-top:1px solid var(--u-ln);font-size:11px;color:var(--u-fnt)}
.cht-p i{width:6px;height:6px;border-radius:50%;background:var(--u-gr)}

/* agent run + the decision card */
.agt{padding:8px}
.agt-run{display:flex;align-items:center;flex-wrap:wrap;gap:6px 10px;margin-bottom:12px}
.agt-run b{font:600 13px/1.3 var(--mono)}
.agt-meta{font-size:12px;color:var(--u-mut)}
.agt-back{margin-left:auto;font-size:12px;color:var(--u-br)}
.agt-grid{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:12px;align-items:start}
.agt-dec{border:1px solid #F0B429;border-radius:11px;padding:13px;background:#FFFCF4;box-shadow:0 10px 30px -18px rgba(150,100,0,.5)}
.agt-dh{display:flex;flex-direction:column;align-items:flex-start;gap:7px;font-size:12px;color:var(--u-mut)}
.agt-dl{margin:11px 0 0;font-size:12.5px;display:grid;gap:3px}
.agt-dl dt{display:inline;color:var(--u-mut)}.agt-dl dd{display:inline;margin:0}
.agt-dl dd.mo{font-size:12px}
.agt-p{margin:9px 0 0;font-size:12px;line-height:1.5;color:var(--u-mut)}
.agt-p b{color:var(--u-ink)}
.agt-acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:11px}
.agt-acts .ui-btn{font-size:12.5px;padding:8px 14px}
.agt-tr{border:1px solid var(--u-ln2);border-radius:11px;padding:13px}
.agt-h4{font-size:12.5px;font-weight:600}
.agt-goal{margin-top:8px;font:12px/1.5 var(--mono);background:var(--u-pn);border:1px solid var(--u-ln);border-radius:8px;padding:7px 9px}
.agt-ol{margin:8px 0 0;padding-left:18px;font-size:12px;line-height:1.55;color:#3a3b45}
.agt-ol li{margin:3px 0;overflow-wrap:anywhere}

/* replay: the player window beside what Postgres holds */
.rpx{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,380px);grid-template-areas:"win pg" "tl tl";gap:14px;align-items:start}
.rpx-win{grid-area:win;padding:0;overflow:hidden}
.rpx-url{display:flex;align-items:center;gap:6px;padding:9px 12px;background:#E9E9EE;border-bottom:1px solid var(--u-ln2)}
.rpx-url>i{width:9px;height:9px;border-radius:50%;background:#D3D3DA;flex:none}
.rpx-url>span{margin-left:6px;flex:1;min-width:0;font:11px/1.4 var(--mono);color:var(--u-mut);background:#fff;border:1px solid var(--u-ln2);border-radius:7px;padding:4px 9px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rpx-shell{padding:12px 14px 14px;display:flex;flex-direction:column;gap:10px}
.rpx-fl{font:12px/1.4 var(--mono);color:var(--u-ink);border-top:1px solid var(--u-ln);padding-top:10px}
.rpx-fl b{background:#1B1C22;color:#fff;border-radius:5px;padding:1px 7px;margin-right:4px;font-weight:600}
.rpx-fl i{font-style:normal;color:var(--u-fnt)}
.rpx-screen{background:var(--u-cv);border:1px solid var(--u-ln2);border-radius:11px;padding:6px}
.rpx-rev{background:#FDF3E3;box-shadow:0 0 0 1px #EFD5A8;border-radius:4px;padding:0 3px;color:#8A5208}
.rpx-er{font:500 10.5px/1.5 var(--mono);color:#8E2A22;background:repeating-linear-gradient(135deg,#FBECEA 0 6px,#F6DEDB 6px 12px);border:1px dashed #E2A59F;border-radius:5px;padding:1px 6px}
.rpx-r{font:10.5px/1.4 var(--mono);color:#A3A4AE}
.rpx-refs{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.rpx-refn{font:11px/1 var(--mono);color:var(--u-fnt);margin-right:2px}.rpx-refn b{color:var(--u-ink)}
.rpx-pg{grid-area:pg;background:#0E1018;border:1px solid var(--hair-2);border-radius:14px;overflow:hidden;min-width:0}
.rpx-pgh{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;padding:13px 15px 11px;border-bottom:1px solid var(--hair-2)}
.rpx-pgk{width:100%;font:600 10.5px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--faint)}
.rpx-pgh>b{font:500 13px/1.3 var(--mono);color:var(--ink)}
.rpx-same{margin-left:auto;font:10.5px/1 var(--mono);color:var(--green);border:1px solid rgba(76,194,148,.35);background:rgba(76,194,148,.08);border-radius:999px;padding:4px 9px;white-space:nowrap}
.rpx-meta{display:flex;flex-wrap:wrap;justify-content:space-between;gap:4px 10px;padding:8px 15px;font:10.5px/1.4 var(--mono);color:var(--faint);border-bottom:1px dashed var(--hair-2)}
.rpx-meta b{color:var(--muted);font-weight:500}
.rpx-cm{margin:12px 15px 4px;font:10.5px/1.4 var(--mono);color:var(--faint)}
.rpx-json{margin:0;padding:0 15px 4px;font:11px/1.6 var(--mono);color:#8C90A8;white-space:pre-wrap;overflow-wrap:anywhere}
.rpx-json b{display:block;font-weight:400}
.rpx-json .j1{padding-left:2ch}
.rpx-json i{font-style:normal}.rpx-json .s{color:#B5E3C8}.rpx-json .n{color:#F0C27B}.rpx-json .l{color:#E59A92}
.rpx-pg .ref{color:#fff;background:#3B4CCA;border-radius:4px;padding:0 3px;font-weight:600;display:inline}
.rpx-pg .red{color:#1A1405;background:#E8B86B;border-radius:4px;padding:0 3px;font-weight:600;display:inline}
.rpx-pg .shp{color:#fff;background:#6D45C4;border-radius:4px;padding:0 3px;font-weight:600;display:inline}
.rpx-foot{margin:12px 0 0;padding:12px 15px 14px;border-top:1px solid var(--hair-2);font-size:12.5px;line-height:1.55;color:var(--muted)}
.rpx-foot b{font:600 11px/1 var(--mono)}
.rpx-strip{grid-area:tl;display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.rpx-strip span{font:11px/1 var(--mono);color:var(--muted);border:1px solid var(--hair-2);border-radius:8px;padding:6px 8px}
.rpx-strip span b{font-weight:500;color:var(--faint);margin-right:3px}
.rpx-strip .ev{border-color:#3A4180}
.rpx-strip .on{background:var(--indigo-deep);border-color:var(--indigo-deep);color:#fff}.rpx-strip .on b{color:#C9CFFB}
.rpx-strip .rpx-sk{border:0;padding:6px 6px 6px 0;color:var(--faint);letter-spacing:.06em;text-transform:uppercase;font-size:10.5px}
/* ---- fit: below its design width a product screen keeps its DESKTOP layout and scales down
   like a screenshot (JS sets --fit, --fh and .fitting; transform, not zoom, so a minimum font
   size can't re-flow the text). No JS: it keeps the design width and scrolls
   sideways inside its own frame, never the page. The screens carry no media queries of their own. */
.ui-fit{--dw:820px;position:relative;min-width:0;max-width:100%}
.ui-fit.fitting{height:var(--fh,auto)}
.ui-fit.fitting>.ui-fit-in{width:var(--dw);transform:scale(var(--fit,1));transform-origin:0 0}
.ui-fit.fitting .ui-side{display:none}
.ui-fit.fitting .ui-app{grid-template-columns:minmax(0,1fr)}
.ui-fit.fitting .rpx{grid-template-columns:minmax(0,1fr) 330px}
.ui-fit-hint{display:none;margin:10px 2px 0;font:11.5px/1.4 var(--mono);color:var(--faint)}
.ui-fit.small+.ui-fit-hint{display:block}
@media (max-width:899px){
  html:not(.js) .ui-fit{overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:6px}
  html:not(.js) .ui-fit>.ui-fit-in{width:var(--dw)}
  html:not(.js) .ui-fit .ui-side{display:none}
  html:not(.js) .ui-fit .ui-app{grid-template-columns:minmax(0,1fr)}
  html:not(.js) .ui-fit .rpx{grid-template-columns:minmax(0,1fr) 330px}
}
</style>
